[project]
name = "headline-news-api"
version = "0.1.0"
description = "基于 FastAPI + SQLAlchemy 2.0 异步 ORM 的新闻资讯后端 API，含用户认证、新闻、收藏与浏览历史四大模块"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "sqlalchemy", "asyncio", "rest-api", "backend"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pydantic>=2.7",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/sakkee37/headline-news-api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
